name: openOMSI app-mode shortcuts

on:
  pull_request:
    paths:
      - crates/tauri-runtime-wry/src/lib.rs
      - crates/tauri-runtime-wry/tests/app-mode.test.cjs
      - .github/workflows/openomsi-app-mode.yml
  push:
    branches: [openomsi/v2]
    paths:
      - crates/tauri-runtime-wry/src/lib.rs
      - crates/tauri-runtime-wry/tests/app-mode.test.cjs
      - .github/workflows/openomsi-app-mode.yml

permissions:
  contents: read

jobs:
  keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test crates/tauri-runtime-wry/tests/app-mode.test.cjs
